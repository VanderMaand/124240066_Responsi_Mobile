name: responsi_mobile
description: Shopedia - Responsi Praktikum Pemrograman Aplikasi Mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                  # mengambil data dari API
  hive: ^2.2.3                  # database lokal (keranjang)
  hive_flutter: ^1.1.0          # Hive untuk Flutter
  shared_preferences: ^2.3.2    # menyimpan email login

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
